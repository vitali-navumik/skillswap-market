name: Tests And Allure Report

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tests-allure.yml'
      - 'tests-framework/**'
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: Test run type shown on the report portal
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regression
          - manual
          - scheduled

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-portal
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/java:v1.54.0-noble

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillswap_market
          POSTGRES_USER: skillswap
          POSTGRES_PASSWORD: skillswap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillswap -d skillswap_market"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://postgres:5432/skillswap_market
      DB_USERNAME: skillswap
      DB_PASSWORD: skillswap
      JWT_SECRET: skillswap-market-demo-secret-key-that-must-be-long-enough-2026
      SERVER_PORT: 8080
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      API_URL: http://127.0.0.1:8080/api
      UI_BASE_URL: http://127.0.0.1:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Prepare dependency cache directories
        run: mkdir -p ~/.gradle/caches ~/.gradle/wrapper ~/.npm

      - name: Cache Gradle and npm packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.npm
          key: ${{ runner.os }}-deps-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'settings.gradle', 'gradle.properties', 'backend/build.gradle', 'tests-framework/build.gradle', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build backend jar
        run: ./gradlew :backend:bootJar -x :backend:test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 0.0.0.0 > frontend-ci.log 2> frontend-ci.err &

      - name: Start backend
        working-directory: backend
        run: |
          nohup java -jar build/libs/skillswap-market-backend-0.0.1-SNAPSHOT.jar > backend-ci.log 2> backend-ci.err &

      - name: Wait for app services
        run: |
          wait_for() {
            name="$1"
            url="$2"
            attempts="$3"
            delay="$4"

            i=1
            while [ "$i" -le "$attempts" ]; do
              if node -e "fetch(process.argv[1]).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" "$url"; then
                echo "$name is ready"
                return 0
              fi
              echo "Waiting for $name... attempt $i/$attempts"
              i=$((i + 1))
              sleep "$delay"
            done

            echo "$name did not become ready in time"
            return 1
          }

          wait_for "backend" "http://127.0.0.1:8080/api/health" 30 5 || {
            echo "--- backend-ci.log ---"
            cat backend/backend-ci.log || true
            echo "--- backend-ci.err ---"
            cat backend/backend-ci.err || true
            exit 1
          }

          wait_for "frontend" "http://127.0.0.1:5173" 30 2 || {
            echo "--- frontend-ci.log ---"
            cat frontend/frontend-ci.log || true
            echo "--- frontend-ci.err ---"
            cat frontend/frontend-ci.err || true
            exit 1
          }

          echo "--- backend-ci.log ---"
          tail -n 80 backend/backend-ci.log || true
          echo "--- frontend-ci.log ---"
          tail -n 80 frontend/frontend-ci.log || true

      - name: Run tests
        id: tests
        run: |
          set +e
          ./gradlew :tests-framework:test
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            echo "TESTS_FAILED=true" >> "$GITHUB_ENV"
          else
            echo "TESTS_FAILED=false" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Build Allure report
        if: always()
        run: ./gradlew :tests-framework:allureReport -x :tests-framework:test

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: tests-framework/build/allure-results
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Allure HTML artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: tests-framework/build/reports/allure-report/allureReport
          if-no-files-found: warn
          retention-days: 30

      - name: Upload backend logs artifact
        if: failure() || env.TESTS_FAILED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-logs
          path: |
            backend/backend-ci.log
            backend/backend-ci.err
          if-no-files-found: warn
          retention-days: 14

      - name: Upload frontend logs artifact
        if: failure() || env.TESTS_FAILED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-logs
          path: |
            frontend/frontend-ci.log
            frontend/frontend-ci.err
          if-no-files-found: warn
          retention-days: 14

      - name: Install git for report portal history
        if: always()
        shell: bash
        run: |
          apt-get update
          apt-get install -y git

      - name: Build report portal
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          REPORT_SOURCE="tests-framework/build/reports/allure-report/allureReport"
          PAGES_DIR="pages-site"

          rm -rf "$PAGES_DIR"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth=1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PAGES_DIR"
          else
            mkdir -p "$PAGES_DIR"
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            TEST_TYPE="scheduled"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TEST_TYPE="${MANUAL_TEST_TYPE:-manual}"
          else
            TEST_TYPE="smoke"
          fi

          RUN_DATE="$(date -u +'%Y-%m-%d %H:%M UTC')"
          RUN_SLUG="$(date -u +'%Y-%m-%d_%H-%M-%S')_${TEST_TYPE}_${GITHUB_SHA::7}"
          REPORT_TARGET="reports/$RUN_SLUG"
          SHORT_SHA="${GITHUB_SHA::7}"
          export TEST_TYPE RUN_DATE REPORT_TARGET SHORT_SHA

          if [ ! -d "$REPORT_SOURCE" ]; then
            mkdir -p "$REPORT_SOURCE/widgets"
            cat > "$REPORT_SOURCE/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Allure report was not generated</title>
            </head>
            <body>
              <h1>Allure report was not generated</h1>
              <p>Check the GitHub Actions logs and uploaded artifacts for setup or infrastructure failures.</p>
            </body>
          </html>
          HTML
            cat > "$REPORT_SOURCE/widgets/summary.json" <<'JSON'
          {
            "statistic": {
              "failed": 0,
              "broken": 1,
              "skipped": 0,
              "passed": 0,
              "total": 1
            }
          }
          JSON
          fi

          mkdir -p "$PAGES_DIR/$REPORT_TARGET"
          cp -a "$REPORT_SOURCE/." "$PAGES_DIR/$REPORT_TARGET/"
          rm -rf "$PAGES_DIR/latest"
          cp -a "$REPORT_SOURCE/." "$PAGES_DIR/latest/"
          touch "$PAGES_DIR/.nojekyll"

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const pagesDir = 'pages-site';
          const reportTarget = process.env.REPORT_TARGET;
          const summaryPath = path.join(pagesDir, reportTarget, 'widgets', 'summary.json');
          const rowsPath = path.join(pagesDir, 'reports-index.json');

          const summary = fs.existsSync(summaryPath)
            ? JSON.parse(fs.readFileSync(summaryPath, 'utf8'))
            : {};
          const statistic = summary.statistic || {};
          const failed = statistic.failed || 0;
          const broken = statistic.broken || 0;
          const skipped = statistic.skipped || 0;
          const passed = statistic.passed || 0;
          const total = statistic.total || passed + failed + broken + skipped;
          const status = failed > 0 ? 'failed' : broken > 0 ? 'broken' : 'passed';

          const previousRows = fs.existsSync(rowsPath)
            ? JSON.parse(fs.readFileSync(rowsPath, 'utf8'))
            : [];
          console.log(`Previous report rows: ${previousRows.length}`);

          const current = {
            status,
            type: process.env.TEST_TYPE,
            date: process.env.RUN_DATE,
            actor: process.env.GITHUB_ACTOR,
            branch: process.env.GITHUB_REF_NAME,
            commit: process.env.SHORT_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runNumber: process.env.GITHUB_RUN_NUMBER,
            url: `${reportTarget}/index.html`,
            passed,
            failed,
            broken,
            skipped,
            total
          };

          const rows = [current, ...previousRows.filter((row) => row.runId !== current.runId)].slice(0, 20);
          console.log(`Current report rows: ${rows.length}`);
          fs.writeFileSync(rowsPath, JSON.stringify(rows, null, 2));

          const badgeClass = (value) => ({
            passed: 'status-passed',
            failed: 'status-failed',
            broken: 'status-broken'
          }[value] || 'status-broken');

          const htmlRows = rows.map((row) => `
            <tr>
              <td><span class="status ${badgeClass(row.status)}">${row.status.toUpperCase()}</span></td>
              <td>${row.type}</td>
              <td>${row.date}</td>
              <td>${row.actor}</td>
              <td>${row.branch}</td>
              <td><code>${row.commit}</code></td>
              <td class="num passed">${row.passed}</td>
              <td class="num failed">${row.failed}</td>
              <td class="num broken">${row.broken}</td>
              <td class="num">${row.skipped}</td>
              <td class="num">${row.total}</td>
              <td><a href="${row.url}">Open</a></td>
            </tr>
          `).join('');

          const html = `<!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>SkillSwap Market Test Reports</title>
              <style>
                :root {
                  color-scheme: light;
                  --bg: #f6f8fb;
                  --panel: #ffffff;
                  --text: #1f2937;
                  --muted: #6b7280;
                  --line: #d7dde7;
                  --passed: #15803d;
                  --failed: #b91c1c;
                  --broken: #a16207;
                }
                body {
                  margin: 0;
                  background: var(--bg);
                  color: var(--text);
                  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                }
                main {
                  max-width: 1180px;
                  margin: 0 auto;
                  padding: 40px 24px;
                }
                header {
                  display: flex;
                  align-items: end;
                  justify-content: space-between;
                  gap: 20px;
                  margin-bottom: 24px;
                }
                h1 {
                  margin: 0 0 6px;
                  font-size: 28px;
                  font-weight: 750;
                }
                p {
                  margin: 0;
                  color: var(--muted);
                }
                .latest {
                  color: var(--text);
                  font-weight: 650;
                }
                .table-wrap {
                  overflow-x: auto;
                  background: var(--panel);
                  border: 1px solid var(--line);
                  border-radius: 8px;
                }
                table {
                  width: 100%;
                  border-collapse: collapse;
                  min-width: 980px;
                }
                th, td {
                  padding: 13px 14px;
                  border-bottom: 1px solid var(--line);
                  text-align: left;
                  white-space: nowrap;
                  font-size: 14px;
                }
                th {
                  color: var(--muted);
                  font-size: 12px;
                  text-transform: uppercase;
                  letter-spacing: .04em;
                  background: #f9fafb;
                }
                tr:last-child td {
                  border-bottom: 0;
                }
                .status {
                  display: inline-flex;
                  align-items: center;
                  border-radius: 999px;
                  padding: 4px 9px;
                  color: #fff;
                  font-size: 12px;
                  font-weight: 750;
                }
                .status-passed { background: var(--passed); }
                .status-failed { background: var(--failed); }
                .status-broken { background: var(--broken); }
                .num {
                  text-align: right;
                  font-variant-numeric: tabular-nums;
                }
                .passed { color: var(--passed); font-weight: 650; }
                .failed { color: var(--failed); font-weight: 650; }
                .broken { color: var(--broken); font-weight: 650; }
                a {
                  color: #1d4ed8;
                  font-weight: 650;
                  text-decoration: none;
                }
                a:hover {
                  text-decoration: underline;
                }
                code {
                  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
                }
              </style>
            </head>
            <body>
              <main>
                <header>
                  <div>
                    <h1>SkillSwap Market Test Reports</h1>
                    <p>Latest 20 GitHub Actions test runs with separate Allure reports.</p>
                  </div>
                  <a class="latest" href="latest/index.html">Open latest report</a>
                </header>
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Status</th>
                        <th>Type</th>
                        <th>Date</th>
                        <th>Triggered by</th>
                        <th>Branch</th>
                        <th>Commit</th>
                        <th>Passed</th>
                        <th>Failed</th>
                        <th>Broken</th>
                        <th>Skipped</th>
                        <th>Total</th>
                        <th>Report</th>
                      </tr>
                    </thead>
                    <tbody>${htmlRows}</tbody>
                  </table>
                </div>
              </main>
            </body>
          </html>`;

          fs.writeFileSync(path.join(pagesDir, 'index.html'), html);
          NODE

          find "$PAGES_DIR/reports" -mindepth 1 -maxdepth 1 -type d 2>/dev/null \
            | sort -r \
            | tail -n +21 \
            | xargs -r rm -rf
        env:
          MANUAL_TEST_TYPE: ${{ github.event.inputs.test_type || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Persist report portal history
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd pages-site
          if [ ! -d .git ]; then
            git init
            git checkout -b gh-pages
          else
            git checkout gh-pages
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No report portal changes to commit"
          else
            git commit -m "Update test report portal for run $GITHUB_RUN_ID"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          fi
          cd ..
          rm -rf pages-site/.git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail workflow if tests failed
        if: always() && env.TESTS_FAILED == 'true'
        run: exit 1
